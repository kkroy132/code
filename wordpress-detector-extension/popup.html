<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <title>WordPress Detector</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon32.png" alt="" />
      <h1>WordPress Detector</h1>
    </header>

    <section class="card" id="current-tab-card">
      <h2>বর্তমান ট্যাব</h2>
      <p class="site-url" id="current-tab-url">—</p>
      <button id="check-current-btn">এই সাইট চেক করুন</button>
      <div class="result" id="current-tab-result" hidden></div>
    </section>

    <section class="card">
      <h2>যেকোনো সাইট চেক করুন</h2>
      <form id="manual-form">
        <input
          type="text"
          id="manual-url"
          placeholder="example.com অথবা https://example.com"
          autocomplete="off"
          required
        />
        <button type="submit" id="check-manual-btn">চেক করুন</button>
      </form>
      <div class="result" id="manual-result" hidden></div>
    </section>

    <section class="card">
      <h2>একাধিক সাইট চেক করুন</h2>
      <textarea
        id="bulk-urls"
        rows="4"
        placeholder="প্রতি লাইনে একটি করে ডোমেইন/URL লিখুন&#10;example.com&#10;another-site.com"
      ></textarea>
      <div class="bulk-actions">
        <button id="bulk-check-btn">সব চেক করুন</button>
        <button id="bulk-export-btn" disabled>CSV ডাউনলোড</button>
      </div>
      <p class="bulk-progress" id="bulk-progress" hidden></p>
      <div class="table-wrap">
        <table id="bulk-table" hidden>
          <thead>
            <tr>
              <th>সাইট</th>
              <th>ফলাফল</th>
              <th>স্কোর</th>
            </tr>
          </thead>
          <tbody id="bulk-tbody"></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <div class="history-header">
        <h2>ইতিহাস</h2>
        <button id="clear-history-btn" class="link-btn">মুছে ফেলুন</button>
      </div>
      <ul id="history-list"></ul>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
